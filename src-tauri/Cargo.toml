[package]
name = "cavia-music"
version = "2.0.0"
description = "Cavia Music desktop and mobile application core"
authors = ["StretchWave"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "cavia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cavia-music"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.4"
lofty = "0.25"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rodio = { version = "0.23", default-features = true, features = ["symphonia-alac", "symphonia-aiff"] }
souvlaki = { version = "0.9.3", default-features = false }

# Desktop playback candidate. Enable only after libmpv is packaged and its
# licensing/build configuration has been reviewed for each desktop target.
rsmpv = { version = "0.2.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
desktop-mpv = ["dep:rsmpv"]
