[package]
name = "cavia-music"
version = "2.0.0"
description = "Cavia Music desktop and mobile application core"
authors = ["StretchWave"]
edition = "2024"
rust-version = "1.90"
default-run = "cavia-music"

[lib]
name = "cavia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cavia-music"
path = "src/main.rs"
test = false

[[bin]]
name = "cavia-bench"
path = "src/bin/benchmarks.rs"
test = false
required-features = ["bench"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.4"
lofty = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
httpdate = "1"
uuid = { version = "1", features = ["v4"] }
keyring = "4.2"
url = "2"
souvlaki = { version = "0.9.3", default-features = false }

# Desktop playback candidate. Enable only after libmpv is packaged and its
# licensing/build configuration has been reviewed for each desktop target.
rsmpv = { version = "0.2.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
desktop-mpv = ["dep:rsmpv"]
bench = []

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rodio = { version = "0.23", default-features = true, features = ["symphonia-alac", "symphonia-aiff"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Mobile playback is provided by Media3 / AVPlayer. Keep Rodio's decoder for
# validating cached audio without linking its CPAL output backend on mobile.
rodio = { version = "0.23", default-features = false, features = ["flac", "mp3", "mp4", "vorbis", "wav", "symphonia-alac", "symphonia-aiff"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
