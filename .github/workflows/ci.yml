name: Cavia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend (TypeScript, Build, Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck and Vite build
        run: npm run build

      - name: Run Node.js contract & unit tests
        run: npm run test:unit

  rust-checks:
    name: Rust (Format, Check, Tests)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify code formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Check compilation on all targets
        run: cargo check --all-targets
        working-directory: src-tauri

      - name: Run Rust unit & integration test suite
        run: cargo test
        working-directory: src-tauri
